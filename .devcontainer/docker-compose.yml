services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    networks:
      - devnet

  rabbitmq:
    image: rabbitmq:4.0-management
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5672:5672" # RabbitMQ broker port
      - "15672:15672" # Management UI
    networks:
      - devnet
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:

networks:
  devnet:
